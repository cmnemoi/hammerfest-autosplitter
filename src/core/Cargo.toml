[package]
name = "hammerfest-core"
version = "1.1.0"
edition = "2021"

# No dependency, and above all not `asr`: that is what makes this crate
# testable. The ASR runtime symbols exist only inside the WebAssembly sandbox,
# so anything that touches the runtime cannot run here.
[dependencies]

# The sources sit beside this file, and not under a second `src/`. Every Rust
# file of the project then lives under the one `src/` at the root.
[lib]
path = "lib.rs"
