# Everything that must pass before a change is merged.
#
# One job on purpose. The toolchain takes about twenty seconds to install and
# the work itself about eighteen, so two jobs in parallel would pay the
# installation twice to save six seconds of wall clock.
name: Continuous Integration

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_EXPERIMENTAL: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The same name the git hook calls, so the two cannot drift apart.
      - run: mise run ci
