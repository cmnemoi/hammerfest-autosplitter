[workspace]
members = ["src/core", "src/reader", "src/process"]
# The end-to-end harness builds the whole LiveSplit runtime: `mise run e2e`
# only.
exclude = ["src/harness"]

[package]
name = "hammerfest-autosplitter"
version = "1.1.0"
edition = "2021"

[features]
default = ["scan-budget"]
# Detailed traces and A/B comparison. The normal module refreshes the map.
diagnostics = []
# Experiment: recognise the measured player before the first game.
known-flash = ["hammerfest-reader/known-flash"]
# Limits the pauses caused by small regions; on in the normal module.
scan-budget = ["hammerfest-reader/scan-budget"]

[dependencies]
asr = { git = "https://github.com/LiveSplit/asr", rev = "89d55ab07198da6fd75cab1ea1a6825b4240b343", features = [
    "alloc",         # Vec for the heap scans
    "flags",         # filter the readable / writable memory ranges
    "integer-vars",  # show the level as a variable
] }
dlmalloc = { version = "0.2.4", features = ["global"] }
# The core, with no runtime and no memory access: it carries the tests.
hammerfest-core = { path = "src/core" }
# The reader, with no runtime either. Its features follow the ones above.
hammerfest-reader = { path = "src/reader", default-features = false }
# The process, adapted to the reader.
hammerfest-process = { path = "src/process" }

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
panic = "abort"
codegen-units = 1
strip = true

[profile.release.build-override]
opt-level = 0
