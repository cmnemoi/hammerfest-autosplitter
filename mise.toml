[tools]
uv = "latest"
# Pinned, because a hook that changes under you is a hook you stop trusting.
pre-commit = "4.6.2"
# The prebuilt binary, not the `cargo:` backend, which compiles it from source.
"ubi:taiki-e/cargo-llvm-cov" = "0.9.1"

[settings]
idiomatic_version_file_enable_tools = ["rust", "python"]

[tasks.build]
description = "Build the autosplitter as a .wasm"
# The target comes from `rust-toolchain.toml`, and mise installs it before the
# task runs. The build does need a system linker, however. See README.md.
run = "cargo build --release --target wasm32-unknown-unknown"

[tasks.test]
description = "Run every test of the workspace, and the one script the net relies on"
# `spec_coverage.py` decides what the coverage report says, so a report that
# lies is worse than no report. Its own checks run here, and nowhere else.
run = [
    "cargo test --workspace",
    "uv run python scripts/spec_coverage.py --self-check",
]

[tasks.lint]
description = "Run clippy over both targets, and fail on any warning"
# Two runs, because the two targets cannot be linted together.
#
# The library is a `cdylib` for the WebAssembly sandbox: `#![no_std]`, with a
# panic handler that only exists on wasm32. Checking that target on the host
# fails before clippy says anything. So the shipped artefact is linted for
# wasm32, and the test code -- which the harness compiles against std -- on the
# host.
#
# clippy comes from `rust-toolchain.toml`, and mise installs it before the
# task runs, so a clone needs no extra step.
run = [
    "cargo clippy --workspace --target wasm32-unknown-unknown -- -D warnings",
    "cargo clippy --workspace --tests -- -D warnings",
]

[tasks.hooks]
description = "Install the git hooks, once per clone"
run = "pre-commit install --install-hooks"

[tasks.coverage]
description = "Measure the line coverage of the code that ships"
# The test-only modules are left out. Counting a synthetic heap as covered
# code would say the net is wider than it is: `pepper_flash_heap.rs` alone is 511
# lines that only ever test themselves.
#
# `src/lib.rs` stays in, at zero percent. The loop is deliberately outside the
# net, and a number that hides that decision is worth nothing.
run = 'cargo llvm-cov --workspace --lcov --output-path lcov.info --ignore-filename-regex "(scenarios|pepper_flash_heap|ruffle_heap|memory_contract|memory|replay|read_cost|stubs|main)[.]rs$"'

[tasks.ci]
description = "Everything that must pass before a change leaves the machine"
# What the git hook runs, and what the CI runs. One name, so the two can never
# drift apart.
depends = ["check", "test"]

[tasks.fmt]
description = "Format the Rust code"
run = "cargo fmt --all"

[tasks.check]
description = "Check the format and the lint, and change nothing. For a hook or CI."
# Only Rust. No formatter is configured for the Python scripts.
depends = ["lint"]
run = "cargo fmt --all --check"

[tasks.read-cost-update]
description = "Write what the reader costs now as the new baseline"
# The test that holds the baseline writes it instead of comparing, when this
# variable is set. See docs/specs/read-cost.md.
run = "cargo test -p hammerfest-reader the_reader_costs_what_the_baseline_says"
env = { READ_COST_UPDATE = "1" }

[tasks.spec-coverage]
description = "Which spec ids have no test yet"
run = "uv run python scripts/spec_coverage.py"

[tasks.build-diagnostics]
description = "Build the measurement module in its own directory"
run = "cargo build --release --target wasm32-unknown-unknown --features diagnostics --target-dir target/diagnostics"

[tasks.probe-runtime]
description = "Measure the cache of the ASR DLL that LiveSplit loads"
run = "uv run python scripts/runtime_probe.py"

[tasks.build-cold-start]
description = "Build the variant that measures the first start"
run = "cargo build --release --target wasm32-unknown-unknown --features diagnostics,known-flash --target-dir target/cold-start"

[tasks.build-scan-budget]
description = "Build the variant that measures late retries"
run = "cargo build --release --target wasm32-unknown-unknown --features diagnostics,scan-budget --target-dir target/scan-budget"

[tasks.summarize-startup]
description = "Summarise the starts from an exported log"
run = "uv run python scripts/summarize_startup.py"

[tasks.capture-startup]
description = "Capture up to 25 starts over 15 minutes, with no manual export"
run = "uv run python scripts/capture_startup.py"

[tasks.state]
description = "Show the level and the clock of the game in progress"
run = "uv run python scripts/hf_state.py"

[tasks.ruffle-state]
description = "Show the level and the clock of a game running in Ruffle, on Linux"
run = "uv run python scripts/ruffle_state.py"

[tasks.capture-ruffle]
description = "Record the memory of a live Ruffle as a fixture, on Linux"
run = "uv run python scripts/capture_ruffle.py"

[tasks.trim-ruffle-capture]
description = "Keep only the pages of a Ruffle capture that hold the game"
run = "uv run python scripts/trim_ruffle_capture.py"

[tasks.watch]
description = "Follow the level changes live"
run = "uv run python scripts/hf_state.py --watch"

[tasks.dump]
description = "Show the GameMode, world and Chrono tables"
run = "uv run python scripts/hf_state.py --dump"

[tasks.trace]
description = "Time the start of a game, from the process to the official start"
run = "uv run python scripts/hf_trace.py"

[tasks.replay-fixture]
description = "Turn a capture into a fixture a Rust test can replay"
run = "uv run python scripts/replay_fixture.py"

[tasks.capture-heap]
description = "Record the plugin memory as a replayable fixture"
run = "uv run python scripts/capture_heap.py"
