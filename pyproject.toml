[project]
name = "hammerfest-autosplitter-tools"
version = "0.1.0"
description = "Reverse engineering and memory exploration tools for the Hammerfest autosplitter"
requires-python = ">=3.14,<3.15"

# No dependency on purpose: ctypes is enough, and that makes them usable
# anywhere. numpy serves only the offline analysis of pointer chains, which
# compares millions of 64 bit integers.
dependencies = []

[dependency-groups]
analysis = [
    "capstone>=5.0.9",
    "numpy>=2",
    "pefile>=2024.8.26",
]
